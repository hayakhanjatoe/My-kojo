<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>For My Kojo 💙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:linear-gradient(135deg,#0a3d62,#1e90ff,#74b9ff);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.hearts{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.heart{position:absolute;animation:float 6s linear infinite}
@keyframes float{0%{transform:translateY(100vh);opacity:0}100%{transform:translateY(-10vh);opacity:1}}
.card{background:rgba(255,255,255,0.95);max-width:380px;width:90%;padding:35px 25px;border-radius:25px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.2)}
.emoji-big{font-size:70px;margin-bottom:15px;display:block}
h1{font-size:26px;color:#0a3d62;margin-bottom:10px;min-height:90px}
.btn{background:linear-gradient(135deg,#0984e3,#74b9ff);color:white;border:none;padding:14px 32px;border-radius:30px;font-size:16px;font-weight:600;cursor:pointer}
.progress{height:6px;background:#dfe6e9;border-radius:10px;margin-top:20px;overflow:hidden}
.progress-bar{height:100%;background:#0984e3;width:0%;transition:0.5s}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="card">
<span class="emoji-big" id="emoji">💙</span>
<h1 id="text">Dost bhi tum...</h1>
<p id="sub">Ek kahani tumhare liye Kojo</p><br>
<button class="btn" id="nextBtn" onclick="nextStep()">Next 💌</button>
<div class="progress"><div class="progress-bar" id="pbar"></div></div>
<div id="step" style="font-size:12px;color:#0984e3;margin-top:8px">1 / 9</div>
</div>
<script>
const steps=[
{text:"Dost bhi tum ho 💙",emoji:"👫💙",sub:"Meri har khushi tum ho"},
{text:"Pyar bhi tum ho 💙",emoji:"🥰💋",sub:"Dil ka sukoon tum ho"},
{text:"Ek bhi tum ho 💙",emoji:"☝️❤️",sub:"Meri duniya sirf tum"},
{text:"1000 bhi tum ho 💙",emoji:"💯💙",sub:"Hazaron me sirf tum"},
{text:"Gussa bhi tum ho 😤💙",emoji:"😤💙",sub:"Naraaz bhi tumse, pyar bhi tumse"},
{text:"Maafi bhi tum ho 🙏💙",emoji:"🥺💋",sub:"Manana bhi tumhe hai"},
{text:"Zindagi ke safar me kaafi ho tum 💙",emoji:"🛤️💙",sub:"Mere hamsafar tum ho"},
{text:"Dil hi dil me... 💋",emoji:"💋❤️💋",sub:"Dekho piche har jagah dil 💋"},
{text:"I Love You So Much Kojo! 💋❤️💋",emoji:"💋💙💋",sub:"Meri jaan, I Love You Forever 💙",final:true}
];
let cur=0;
function nextStep(){
if(cur<steps.length-1){cur++;update()}else{alert("Kojo 💙 I Love You So Much! 💋")}
}
function update(){
let s=steps[cur];
document.getElementById('text').innerText=s.text;
document.getElementById('emoji').innerText=s.emoji;
document.getElementById('sub').innerText=s.sub;
document.getElementById('pbar').style.width=(cur+1)/steps.length*100+'%';
document.getElementById('step').innerText=(cur+1)+' / '+steps.length;
if(s.final){document.body.style.background='linear-gradient(135deg,#0a3d62,#e84393,#fd79a8)';document.getElementById('nextBtn').innerText='Kiss Me 💋'}
createHeart();
}
function createHeart(){
let h=document.createElement('div');h.className='heart';
let e=['💙','💋','❤️','💘','😘'];
h.innerText=e[Math.floor(Math.random()*e.length)];
h.style.left=Math.random()*100+'vw';h.style.fontSize=Math.random()*20+15+'px';
h.style.animationDuration=Math.random()*3+4+'s';
document.getElementById('hearts').appendChild(h);
setTimeout(()=>h.remove(),6000);
}
setInterval(createHeart,400);
update();
</script>
</body>
</html>
